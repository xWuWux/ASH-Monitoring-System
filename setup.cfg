[mutmut]
# Nightly mutation testing configuration (mutmut 3.x).
#
# Mutate all Python modules under src/consumer, but run only the fast unit
# tests in tests/unit/python. Those tests mock PostgreSQL and Kafka, so they
# can run once per mutant without provisioning services. Integration,
# contract, degradation, and Kafka E2E suites are deliberately excluded.
source_paths =
    src/consumer
pytest_add_cli_args_test_selection =
    tests/unit/python
pytest_add_cli_args =
    -x
    -q
mutate_only_covered_lines = true
