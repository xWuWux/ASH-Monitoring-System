name: ASH CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: ShellCheck Bash scripts
        run: |
          find src scripts -type f -name "*.sh" \
            ! -path "*/shells/zsh-integration.sh" \
            -print0 | xargs -0 -r shellcheck -S error

      - name: Python lint
        run: |
          pip install flake8 bandit
          flake8 src/consumer/ --max-line-length=120 --ignore=E501,W503
          bandit -r src/consumer/ -ll -q

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BATS
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq inotify-tools uuid-runtime
          pip3 install kafka-python psycopg2-binary prometheus-client pytest flask pyjwt requests

      - name: Run BATS unit tests
        run: bats tests/unit/ --tap

      - name: Run Python unit tests
        run: pytest tests/unit/python/ -v 2>/dev/null || echo "No Python unit tests yet"

  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BATS
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq inotify-tools uuid-runtime

      - name: Run regression tests
        run: bats tests/regression/ --tap

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ash_logs
          POSTGRES_USER: ash
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip3 install kafka-python psycopg2-binary prometheus-client pytest flask pyjwt requests

      - name: Run integration tests
        env:
          ASH_DATABASE_URL: postgresql://ash:test_password@localhost:5432/ash_logs
        run: |
          python3 -c "
          import psycopg2
          conn = psycopg2.connect('postgresql://ash:test_password@localhost:5432/ash_logs')
          print('Database connection OK')
          conn.close()
          "

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --force-use-all-plugins 2>/dev/null || true

      - name: Bandit security scan
        run: |
          pip install bandit
          bandit -r src/consumer/ -ll

  build-package:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build installation archive
        run: |
          VERSION=$(grep 'ASH_VERSION=' src/agent/ash-agent.sh | head -1 | cut -d'"' -f2)
          tar -czf "ash-monitor-${VERSION}.tar.gz" \
            src/ config/ deployments/ scripts/ tests/ docs/
          echo "Built: ash-monitor-${VERSION}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ash-monitor-package
          path: ash-monitor-*.tar.gz
