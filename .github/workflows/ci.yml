name: ASH CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ── 1. Lint, Format, Config & Secret Scan (fastest) ─────────────────────
  lint-format-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Placeholders only: docker compose config validates the file without
      # connecting to anything. The `${VAR:?}` guards still need values.
      ASH_DB_PASSWORD: ci-placeholder
      ASH_JWT_SECRET: ci-placeholder
      ASH_ADMIN_USER: ci-placeholder
      ASH_ADMIN_PASS: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck and shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/v3.9.0/shfmt_v3.9.0_linux_amd64"
          chmod +x /usr/local/bin/shfmt

      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint

      - name: Install Python lint/format tools
        run: pip install flake8 black detect-secrets yamllint

      - name: ShellCheck (src, scripts, test helpers)
        run: |
          find src scripts tests -type f -name "*.sh" \
            ! -path "*/shells/zsh-integration.sh" \
            -print0 | xargs -0 -r shellcheck -S error

      - name: shfmt (format check)
        run: |
          find src scripts tests -type f -name "*.sh" \
            ! -path "*/shells/zsh-integration.sh" \
            -print0 | xargs -0 shfmt -d -i 4 -ci

      - name: actionlint (workflow syntax and expressions)
        run: actionlint .github/workflows/*.yml

      - name: yamllint (workflows + compose)
        run: yamllint --strict .github/workflows deployments/docker/docker-compose.yml

      - name: docker compose config
        run: docker compose -f deployments/docker/docker-compose.yml config --quiet

      - name: flake8
        run: |
          # E203: black intentionally adds a space before ':' in slices
          # (PEP8-compliant); flake8's default rule disagrees with black.
          # This is black's own documented recommendation, not a local hack.
          flake8 src/consumer tests \
            --max-line-length=120 --ignore=E501,W503,E226,E203

      - name: black (format check)
        run: black --check src/consumer tests

      - name: detect-secrets (fail on newly introduced secrets only)
        run: |
          # --exclude-files must cover the baseline file itself: detect-secrets
          # scans it like any other file, and its own hashed_secret hex values
          # look like high-entropy strings to the Hex/Keyword plugins. Without
          # this exclusion, the baseline is "new findings" on every single
          # run even with zero real changes, permanently defeating the gate.
          #
          # The scan also rewrites the baseline's generated_at timestamp on
          # every run regardless of findings, so a raw `git diff` on the
          # file always shows a change. Compare everything except that field.
          cp .secrets.baseline /tmp/baseline_before.json
          detect-secrets scan --baseline .secrets.baseline \
            --exclude-files '(\.git/|\.secrets\.baseline$)' \
            --force-use-all-plugins
          python3 -c "
          import json, sys
          before = json.load(open('/tmp/baseline_before.json'))
          after = json.load(open('.secrets.baseline'))
          before.pop('generated_at', None)
          after.pop('generated_at', None)
          if before != after:
              print('New potential secrets detected (or an existing finding moved lines).')
              print('If this is a real secret, remove it. If it is a false positive or')
              print('just an existing finding shifting to a new line number, regenerate')
              print('and commit .secrets.baseline locally.')
              sys.exit(1)
          print('No new secrets detected.')
          "

  # ── 2. Build Test (does it compile/parse?) ──────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          status=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || status=1
          done < <(find src scripts tests -type f -name "*.sh" \
            ! -path "*/shells/zsh-integration.sh" -print0)
          exit $status

      - name: Python syntax check
        run: python3 -m compileall -q src/consumer tests

      - name: JSON validation
        run: |
          for f in config/*.json.example src/common/schema/event-v1.json; do
            jq -e . "$f" >/dev/null
          done

  # ── 3. Security & Compliance (SAST + SCA + license check) ───────────────
  security-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-format-secrets, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bandit (SAST)
        run: |
          pip install bandit
          bandit -r src/consumer/ -ll -q

      - name: Semgrep (SAST)
        run: |
          pip install semgrep
          semgrep --config p/security-audit --config p/secrets src/ --error

      - name: pip-audit (dependency SCA)
        run: |
          pip install pip-audit
          pip-audit -r src/consumer/requirements.txt

      - name: License check
        run: |
          python -m venv /tmp/license-check-venv
          /tmp/license-check-venv/bin/pip install --quiet -r src/consumer/requirements.txt pip-licenses
          # Fails only on strong copyleft (GPL/AGPL). LGPL (psycopg2-binary)
          # and permissive/weak-copyleft licenses are allowed -- LGPL permits
          # dynamic linking/use without requiring this project's own code to
          # be LGPL, unlike GPL/AGPL.
          /tmp/license-check-venv/bin/pip-licenses \
            --fail-on="GPL;AGPL" \
            --ignore-packages pip-licenses prettytable wcwidth

  # ── 3b. OSV-Scanner (independent vulnerability database) ────────────────
  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OSV-Scanner
        run: |
          curl -fsSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan resolved runtime dependencies
        # requirements.txt uses ranges (>=), which OSV treats as the lowest
        # version in the range and reports as vulnerable. Scan the versions
        # pip actually resolves instead, matching what ships in the image.
        run: |
          python -m venv /tmp/osv-venv
          /tmp/osv-venv/bin/pip install --quiet -r src/consumer/requirements.txt
          /tmp/osv-venv/bin/pip freeze > /tmp/osv-requirements.txt
          osv-scanner scan source --lockfile /tmp/osv-requirements.txt

  # ── 4. Unit, Shell & Python Tests (blocking, with coverage) ─────────────
  unit-shell-tests:
    # kcov (see the coverage step below) was dropped from Ubuntu's archive
    # starting with noble (24.04, what ubuntu-latest now points to) -- it's
    # only packaged for jammy (22.04). Pinned here so the coverage step
    # actually works instead of silently never running.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install BATS
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq inotify-tools uuid-runtime zsh fish
          pip install -r src/consumer/requirements.txt pytest pytest-cov

      - name: Install kcov (best-effort -- coverage step is report-only)
        continue-on-error: true
        run: sudo apt-get install -y -qq kcov

      - name: Run BATS unit tests (blocking)
        run: |
          for test_file in tests/unit/*.bats; do
            echo "===== ${test_file} ====="
            timeout 90s bats --verbose-run "$test_file"
          done

      - name: Run BATS regression tests (blocking)
        run: |
          for test_file in tests/regression/*.bats; do
            echo "===== ${test_file} ====="
            timeout 90s bats --verbose-run "$test_file"
          done

      - name: Run BATS shell-integration tests (blocking)
        run: |
          for test_file in tests/shell/*.bats; do
            echo "===== ${test_file} ====="
            timeout 90s bats --verbose-run "$test_file"
          done

      - name: Shell coverage (report only, no threshold yet)
        continue-on-error: true
        run: |
          mkdir -p coverage
          for test_file in tests/unit/*.bats tests/regression/*.bats tests/shell/*.bats; do
            name=$(basename "$test_file")
            kcov --include-path="${GITHUB_WORKSPACE}/src/agent" \
              "coverage/${name}" bats "$test_file" || true
          done
          kcov --merge coverage/merged coverage/*.bats
          if [ -f coverage/merged/coverage.json ]; then
            pct=$(python3 -c "import json; print(json.load(open('coverage/merged/coverage.json'))['percent_covered'])")
            echo "Shell coverage: ${pct}%" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Could not locate kcov's merged coverage.json -- see uploaded artifact" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload shell coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Run Python unit tests (with coverage)
        run: |
          pytest tests/unit/python -v \
            --cov=src/consumer --cov-report=term --cov-report=xml

      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ── 5. Degradation / Chaos Tests (every push and PR) ────────────────────
  degradation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BATS
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq inotify-tools uuid-runtime
          pip install -r src/consumer/requirements.txt pytest

      - name: Run BATS degradation tests (blocking)
        run: |
          for test_file in tests/degradation/*.bats; do
            echo "===== ${test_file} ====="
            timeout 90s bats --verbose-run "$test_file"
          done

      - name: Run Python degradation tests (blocking)
        run: pytest tests/degradation/python -v

  # ── 6. Smoke Tests (every push and PR) ──────────────────────────────────
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ash_logs
          POSTGRES_USER: ash
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BATS
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq inotify-tools uuid-runtime
          pip install -r src/consumer/requirements.txt

      - name: Run agent pipeline smoke test
        run: bats --verbose-run tests/smoke/test_agent_pipeline.bats

      - name: Run API smoke test against PostgreSQL
        env:
          ASH_DATABASE_URL: postgresql://ash:test_password@localhost:5432/ash_logs
          ASH_JWT_SECRET: ci-smoke-jwt-secret-not-for-production
          ASH_ADMIN_USER: smoke-admin
          ASH_ADMIN_PASS: ci-smoke-password
        run: bash tests/smoke/smoke-api.sh

      - name: Build deployment images
        run: |
          docker build -f deployments/docker/Dockerfile.api -t ash-api:ci .
          docker build -f deployments/docker/Dockerfile.consumer -t ash-consumer:ci .

  # ── 6b. Log-Leak / Secret-Egress Tests (every push and PR) ──────────────
  log-leak-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BATS
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq inotify-tools uuid-runtime
          pip install -r src/consumer/requirements.txt pytest

      - name: Agent log-leak tests
        run: bats --verbose-run tests/security/test_log_leak.bats

      - name: API log-leak tests
        run: pytest tests/security/python -v

  # ── 6c. API Contract Tests (real PostgreSQL, every push and PR) ─────────
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ash_logs
          POSTGRES_USER: ash
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r src/consumer/requirements.txt pytest

      - name: Run API contract tests against PostgreSQL
        env:
          ASH_DATABASE_URL: postgresql://ash:test_password@localhost:5432/ash_logs
          ASH_JWT_SECRET: ci-contract-jwt-secret-not-for-production
          ASH_ADMIN_USER: contract-admin
          ASH_ADMIN_PASS: ci-contract-password
        run: pytest tests/contract -v

  # ── 7. Integration Tests & Migration Checks ──────────────────────────────
  integration-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-shell-tests, security-compliance]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ash_logs
          POSTGRES_USER: ash
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r src/consumer/requirements.txt

      - name: Schema creation + migration idempotency check
        working-directory: src/consumer
        run: |
          python3 <<'PYEOF'
          import importlib
          import logging
          import sys
          import uuid

          sys.path.insert(0, ".")
          ASHConsumer = importlib.import_module("ash-consumer").ASHConsumer

          # Bypass __init__ (which unconditionally sets up a Kafka consumer
          # too -- not needed here): construct just enough state to exercise
          # _setup_database()/_create_tables() against a real Postgres.
          consumer = object.__new__(ASHConsumer)
          consumer.config = {
              "database_url": "postgresql://ash:test_password@localhost:5432/ash_logs"
          }
          consumer.logger = logging.getLogger("integration-test")

          consumer._setup_database()
          assert consumer.db_conn is not None, "database setup failed"

          expected_tables = {"command_logs", "file_changes", "sessions", "alerts"}
          with consumer.db_conn.cursor() as cur:
              cur.execute(
                  "SELECT table_name FROM information_schema.tables WHERE table_schema='public'"
              )
              tables = {row[0] for row in cur.fetchall()}
          missing = expected_tables - tables
          assert not missing, f"missing tables after schema creation: {missing}"
          print(f"Schema creation OK: {sorted(expected_tables)}")

          # Migration check: insert real data, re-run schema creation (the
          # only "migration" mechanism this project has -- CREATE TABLE IF
          # NOT EXISTS at startup, see docs/REMAINING_GAPS.md), then confirm
          # the data survived.
          session_id = str(uuid.uuid4())
          with consumer.db_conn.cursor() as cur:
              cur.execute(
                  "INSERT INTO sessions (session_id, hostname) VALUES (%s, %s)",
                  (session_id, "ci-integration-test"),
              )
              consumer.db_conn.commit()

          consumer._create_tables()  # re-run "migration"

          with consumer.db_conn.cursor() as cur:
              cur.execute(
                  "SELECT count(*) FROM sessions WHERE session_id = %s", (session_id,)
              )
              count = cur.fetchone()[0]
          assert count == 1, "data lost after re-running schema migration"
          print("Migration idempotency check OK: data survived a second schema run")
          PYEOF

  # ── Build installable package (existing artifact build) ─────────────────
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [integration-migration]
    steps:
      - uses: actions/checkout@v4

      - name: Build installation archive
        run: |
          VERSION=$(grep 'ASH_VERSION=' src/agent/ash-agent.sh | head -1 | cut -d'"' -f2)
          tar -czf "ash-monitor-${VERSION}.tar.gz" \
            src/ config/ deployments/ scripts/ tests/ docs/
          echo "Built: ash-monitor-${VERSION}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ash-monitor-package
          path: ash-monitor-*.tar.gz

  # ── Capstone: everything required for merge passed ──────────────────────
  ci-success:
    runs-on: ubuntu-latest
    needs:
      [
        lint-format-secrets,
        build,
        security-compliance,
        osv-scanner,
        unit-shell-tests,
        degradation-tests,
        smoke-tests,
        log-leak-test,
        contract-tests,
        integration-migration,
        build-package,
      ]
    steps:
      - run: echo "Ready for code review and merge."

  # ── 8. Ephemeral Deploy & Performance Benchmarks (optional/contextual) ──
  # Not part of the required-to-merge chain above: spins up the full
  # docker-compose stack, which is slow and heavier than a PR should have to
  # wait on for every push. Runs on push to main, or on demand.
  ephemeral-deploy-benchmarks:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [build-package]
    timeout-minutes: 20
    env:
      ASH_DB_PASSWORD: ci-ephemeral-test-password
      ASH_JWT_SECRET: ci-ephemeral-test-jwt-secret-not-for-real-use
      ASH_ADMIN_USER: ci-ephemeral-admin
      ASH_ADMIN_PASS: ci-ephemeral-password
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        working-directory: deployments/docker
        run: docker compose up -d --build

      - name: Wait for services to become healthy
        run: |
          for i in $(seq 1 30); do
            unhealthy=$(docker ps --filter "health=unhealthy" -q)
            starting=$(docker ps --filter "health=starting" -q)
            if [ -z "$unhealthy" ] && [ -z "$starting" ]; then
              echo "All containers healthy (or have no healthcheck)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out waiting for containers to become healthy."
              docker ps
              docker compose -f deployments/docker/docker-compose.yml logs
              exit 1
            fi
            sleep 5
          done

      - name: Smoke test the API
        run: curl -fsS http://localhost:8080/health

      - name: Run performance benchmark
        run: bash tests/performance/benchmark.sh 1000 | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmark-results
          path: benchmark-results.txt

      - name: Tear down the stack
        if: always()
        working-directory: deployments/docker
        run: docker compose down -v
