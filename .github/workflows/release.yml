name: ASH Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v2.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release metadata
        run: ./scripts/validate-release.sh --tag "$RELEASE_TAG"

      - name: Verify tag commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "::error::Tag ${RELEASE_TAG} points to ${tag_sha}, which is not on main."
            exit 1
          fi
          echo "Tag ${RELEASE_TAG} points to ${tag_sha} on main."

      - name: Verify CI succeeded for tag commit
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse HEAD)"
          runs_url="repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${tag_sha}&per_page=100"
          run_id="$(gh api "$runs_url" --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .event == "push" and .head_branch == "main" and .conclusion == "success")][0].id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful ASH CI push run found for ${tag_sha} on main."
            exit 1
          fi
          jobs_url="repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100"
          gate="$(gh api "$jobs_url" --jq '[.jobs[] | select(.name == "ci-success" and .conclusion == "success")] | length')"
          if [[ "$gate" -eq 0 ]]; then
            echo "::error::ci-success did not succeed for ${tag_sha} (run ${run_id})."
            exit 1
          fi
          echo "ASH CI and ci-success succeeded for ${tag_sha} (run ${run_id})."

      - name: Refuse to overwrite an existing release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} already exists; refusing to overwrite."
            exit 1
          fi

      - name: Build release assets
        run: ./scripts/build-release.sh --version "${RELEASE_TAG#v}" --output-dir dist

      - name: Create GitHub release
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          args=(
            release create "$RELEASE_TAG"
            "dist/ash-monitor-${version}.tar.gz"
            "dist/SHA256SUMS"
            --verify-tag
            --title "ASH ${RELEASE_TAG}"
            --notes-file "dist/release-notes.md"
          )
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Show release
        run: gh release view "$RELEASE_TAG"
