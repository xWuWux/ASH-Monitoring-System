name: ASH Nightly Resilience and Mutation

on:
  schedule:
    # 03:00 UTC daily. Nightly work is intentionally outside ci.yml so PR
    # feedback stays fast; the k6 API load test stays in ci.yml's
    # ephemeral-deploy-benchmarks job (main push + manual).
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ── Real-service outage/recovery ────────────────────────────────────────
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASH_DB_PASSWORD: ci-resilience-test-password  # pragma: allowlist secret
      ASH_JWT_SECRET: ci-resilience-test-jwt-secret-not-for-real-use  # pragma: allowlist secret
      ASH_ADMIN_USER: ci-resilience-admin
      ASH_ADMIN_PASS: ci-resilience-password  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack with Toxiproxy
        run: |
          docker compose \
            -f deployments/docker/docker-compose.yml \
            -f deployments/docker/docker-compose.resilience.yml \
            up -d --build

      - name: Wait for containers to become healthy
        run: |
          for i in $(seq 1 40); do
            unhealthy=$(docker ps --filter "health=unhealthy" -q)
            starting=$(docker ps --filter "health=starting" -q)
            if [ -z "$unhealthy" ] && [ -z "$starting" ]; then
              echo "All containers healthy (or have no healthcheck)."
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "Timed out waiting for containers to become healthy."
              docker ps
              docker compose \
                -f deployments/docker/docker-compose.yml \
                -f deployments/docker/docker-compose.resilience.yml \
                logs
              exit 1
            fi
            sleep 5
          done

      - name: PostgreSQL outage and Toxiproxy latency
        run: bash tests/resilience/postgres-outage.sh

      - name: Tear down the stack
        if: always()
        run: |
          docker compose \
            -f deployments/docker/docker-compose.yml \
            -f deployments/docker/docker-compose.resilience.yml \
            down -v

  # ── Mutation testing (pure unit tests only) ─────────────────────────────
  mutation:
    runs-on: ubuntu-latest
    # 120-minute mutation cap plus install/artifact overhead.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/consumer/requirements.txt pytest "mutmut==3.8.1"

      - name: Run mutation testing (120-minute cap)
        run: |
          # setup.cfg limits mutmut to src/consumer and tests/unit/python.
          # DB/Kafka integration suites are excluded; those cannot run once
          # per mutant without provisioning services.
          timeout 7200 mutmut run

      - name: Collect mutation results
        if: always()
        run: |
          mutmut results > mutation-results.txt 2>&1 || true
          cat mutation-results.txt

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: |
            mutation-results.txt
            .mutmut-cache
            mutants/
          if-no-files-found: warn
