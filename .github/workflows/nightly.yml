name: ASH Nightly Resilience and Mutation

on:
  schedule:
    # 03:00 UTC daily. Nightly work is intentionally outside ci.yml so PR
    # feedback stays fast; the k6 API load test stays in ci.yml's
    # ephemeral-deploy-benchmarks job (main push + manual).
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ── Real-service outage/recovery ────────────────────────────────────────
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASH_DB_PASSWORD: ci-resilience-test-password  # pragma: allowlist secret
      ASH_JWT_SECRET: ci-resilience-test-jwt-secret-not-for-real-use  # pragma: allowlist secret
      ASH_ADMIN_USER: ci-resilience-admin
      ASH_ADMIN_PASS: ci-resilience-password  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack with Toxiproxy
        run: |
          docker compose \
            -f deployments/docker/docker-compose.yml \
            -f deployments/docker/docker-compose.resilience.yml \
            up -d --build

      - name: Wait for the API and Toxiproxy
        run: |
          # The API's /health/ready checks PostgreSQL; Toxiproxy's /version
          # proves the proxy is serving. Waiting on these endpoints is proof,
          # unlike an empty `docker ps --filter health=starting` result on the
          # first iteration before healthchecks have registered.
          for i in $(seq 1 60); do
            api_status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              http://127.0.0.1:8080/health/ready || true)
            proxy_status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              http://127.0.0.1:8474/version || true)
            if [ "$api_status" = "200" ] && [ "$proxy_status" = "200" ]; then
              echo "API and Toxiproxy are ready."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for API/Toxiproxy (api=$api_status proxy=$proxy_status)."
              docker ps
              docker compose \
                -f deployments/docker/docker-compose.yml \
                -f deployments/docker/docker-compose.resilience.yml \
                logs
              exit 1
            fi
            sleep 5
          done

      - name: PostgreSQL outage and Toxiproxy latency
        run: bash tests/resilience/postgres-outage.sh

      - name: Tear down the stack
        if: always()
        run: |
          docker compose \
            -f deployments/docker/docker-compose.yml \
            -f deployments/docker/docker-compose.resilience.yml \
            down -v

  # ── Mutation testing (pure unit tests only) ─────────────────────────────
  mutation:
    runs-on: ubuntu-latest
    # 120-minute mutation cap plus install/artifact overhead.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/consumer/requirements.txt pytest "mutmut==3.8.1"

      - name: Run mutation testing (120-minute cap)
        # The mutation *score* is report-only until a threshold is agreed, but
        # a mutmut crash or a timeout must not be hidden: those mean the
        # experiment did not run. mutmut exits 0 even with surviving mutants,
        # so only tool failures and timeout exit non-zero here.
        run: |
          # setup.cfg limits mutmut to src/consumer and tests/unit/python.
          # DB/Kafka integration suites are excluded; those cannot run once
          # per mutant without provisioning services.
          set +e
          timeout 7200 mutmut run
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "mutation run exceeded the 120-minute cap" >&2
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "mutmut failed with exit code $rc" >&2
            exit "$rc"
          fi

      - name: Collect mutation results
        if: always()
        run: |
          mutmut results > mutation-results.txt 2>&1 || true
          cat mutation-results.txt

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: |
            mutation-results.txt
            .mutmut-cache
            mutants/
          if-no-files-found: warn
