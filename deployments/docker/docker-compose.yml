version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ash_logs
      POSTGRES_USER: ash
      POSTGRES_PASSWORD: ${ASH_DB_PASSWORD:?Set ASH_DB_PASSWORD (see .env.example) — no default is provided}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ash -d ash_logs"]
      interval: 5s
      timeout: 3s
      retries: 5

  ash-consumer:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.consumer
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ASH_DATABASE_URL: postgresql://ash:${ASH_DB_PASSWORD:?Set ASH_DB_PASSWORD (see .env.example) — no default is provided}@postgres/ash_logs
      ASH_KAFKA_BROKERS: kafka:29092
    volumes:
      - ash_logs:/var/log/ash
      - ash_archive:/var/archive/ash
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; r=requests.get('http://localhost:9090'); assert r.status_code==200"]
      interval: 30s
      timeout: 5s
      retries: 3

  ash-api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASH_DATABASE_URL: postgresql://ash:${ASH_DB_PASSWORD:?Set ASH_DB_PASSWORD (see .env.example) — no default is provided}@postgres/ash_logs
      ASH_JWT_SECRET: ${ASH_JWT_SECRET:?Set ASH_JWT_SECRET (see .env.example) — the old default was a publicly-known literal that let anyone forge admin tokens}
      ASH_ADMIN_USER: ${ASH_ADMIN_USER:?Set ASH_ADMIN_USER (see .env.example) — no default is provided}
      ASH_ADMIN_PASS: ${ASH_ADMIN_PASS:?Set ASH_ADMIN_PASS (see .env.example) — the old default was the publicly-known literal "admin"}
      ASH_API_PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  ash_logs:
  ash_archive:
