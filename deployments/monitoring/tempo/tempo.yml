# ASH Tempo (single binary, local filesystem storage)
#
# The collector sends traces over OTLP/gRPC. Tempo's metrics generator writes
# span metrics and the service graph to Prometheus via remote write, which
# powers the RED/service dashboards.
server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # Local-only stack: keep two days of blocks. This is not a long-term
    # retention preset; use object storage for that.
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: ash
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9091/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      dimensions: []
    span_metrics:
      dimensions: []

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
