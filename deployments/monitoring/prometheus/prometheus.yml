# ASH Prometheus
#
# Scrapes the consumer health/metrics listener, the API /metrics endpoint
# (bearer token read from a 0600 runtime file), the collector, Tempo, Loki,
# Alertmanager, Grafana, and itself. Tempo remote-writes span metrics to the
# receiver enabled by --web.enable-remote-write-receiver.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ash
    stack: monitoring

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9091"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # The consumer health/metrics listener is internal-only and unauthenticated.
  - job_name: ash-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["ash-consumer:9090"]

  # The API /metrics endpoint is fail-closed behind ASH_METRICS_TOKEN. The
  # init script renders the same token to a 0600 file; Prometheus reads it
  # with credentials_file so the token never appears in this config.
  - job_name: ash-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/ash-api-token
    static_configs:
      - targets: ["ash-api:8080"]
